name: Deploy

# A git tag v* is a release: build the image, push it to GHCR, deploy it to
# Render, then wait until the live /health reports this exact commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: build & push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to Render
    runs-on: ubuntu-latest
    needs: image
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Trigger Render deploy hook with the new image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1; fi
          encoded=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE")
          curl -fsS -X POST "${HOOK}&imgURL=${encoded}" > /dev/null
          echo "deploy requested for $IMAGE"
      - name: Wait until /health reports this commit
        env:
          URL: ${{ vars.PUBLIC_URL }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS "$URL/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"gitSha\":\"$SHA\""; then echo "live: $SHA"; exit 0; fi
            sleep 10
          done
          echo "the live service never reported $SHA"; exit 1
